<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in · VirtuTrade</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;color:#172d32;background:#f6f8f7;margin:0}
    main{max-width:560px;margin:48px auto;padding:0 24px}
    h1{font-size:30px}form{background:#fff;border:1px solid #dce5df;border-radius:10px;padding:24px}
    label{display:block;font-size:13px;margin:14px 0 6px}input{width:100%;padding:10px;font-size:14px;box-sizing:border-box}
    button{margin-top:18px;padding:11px 22px;font-size:15px;background:#173f39;color:#fff;border:0;border-radius:6px;cursor:pointer}
    .error{background:#fdecec;border:1px solid #f3c1c1;color:#8f2f38;border-radius:8px;padding:12px 16px;margin-bottom:16px}
    nav{margin-top:18px;font-size:14px}nav a{color:#173f39;margin-right:14px}
  </style>
</head>
<body>
  <main>
    <h1>Log in to your simulation account</h1>
    <p>Five wrong passwords in a row lock the account for 15 minutes.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required value="{{ email }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Log in</button>
    </form>
    <nav><a href="/register">Register</a><a href="/market">Market</a></nav>
  </main>
</body>
</html>
