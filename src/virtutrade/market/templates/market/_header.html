<header class="app-header">
  <a class="brand" href="/market"><span class="brand-mark" aria-hidden="true">V</span>VirtuTrade<span class="brand-dot">.</span></a>
  <nav class="main-nav" aria-label="Main">
    <a href="/market" {% if current_page == 'market' %}aria-current="page"{% endif %}>Market</a>
    <a href="/trade" {% if current_page == 'trade' %}aria-current="page"{% endif %}>Buy shares</a>
    {% if portfolio_url and g.current_account %}<a href="{{ portfolio_url }}">Portfolio</a>{% endif %}
  </nav>
  <div class="account-nav"><span class="badge">PAPER TRADING</span>
    {% if g.current_account %}<span class="account-email">{{ g.current_account.email }}</span>{% if current_page == 'market' %}<span class="account-balance">{{ g.current_account.cash_vnd|vnd }} VND</span>{% endif %}
    <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ g.csrf_token }}"><button type="submit" class="header-button">Log out</button></form>
    {% else %}<a href="/login">Log in</a><a class="header-button" href="/register">Register</a>{% endif %}
  </div>
</header>
