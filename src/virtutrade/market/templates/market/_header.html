<header>
  <a class="brand" href="/market"> V<span>■</span> VirtuTrade</a>

  <div class="header-actions">
    <nav class="account-nav" aria-label="Account">
      {% if g.current_account %}
        <span>{{ g.current_account.email }}</span>
        <form method="post" action="/logout" style="display: inline; margin-left: 12px">
          <input type="hidden" name="csrf_token" value="{{ g.csrf_token }}">
          <button type="submit">Log out</button>
        </form>
      {% else %}
        <a href="/login">Log in</a>
      {% endif %}
    </nav>
    <span class="badge">PAPER TRADING</span>
  </div>
</header>
