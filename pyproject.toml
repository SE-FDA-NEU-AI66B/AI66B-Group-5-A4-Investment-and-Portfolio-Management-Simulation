[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtutrade"
version = "0.1.0"
description = "Team 05 paper-trading market walking skeleton"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Development tools, pinned so CI, Codespaces and every laptop run the same versions.
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.3"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"virtutrade.accounts" = ["templates/accounts/*.html"]
"virtutrade.market" = ["templates/market/*.html", "static/*.css", "static/*.js"]
"virtutrade.orders" = ["templates/orders/*.html", "static/*.js"]
"virtutrade.portfolio" = ["templates/portfolio/*.html", "static/*.css"]